[project]
name = "invoice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Likhitha1234-lab", email = "likhithan242@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "openai>=3.24.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
]

[project.scripts]
invoice-agent = "invoice_agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
